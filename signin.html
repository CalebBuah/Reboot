<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="signin.css" />
  </head>
  <body>
    <div class="orbs">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
    </div>
    <div class="grid-bg"></div>

    <div class="wrapper">
      <div class="card">
        <div class="brand">
          <div class="brand-icon">R</div>
          <span class="brand-name">Reboot</span>
        </div>

        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your account to continue</p>

        <form method="post" action="#">
          <div class="field">
            <label class="field-label" for="username">Username</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <input
                id="username"
                name="username"
                type="text"
                placeholder="Enter your username"
                required
              />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                class="toggle-pw"
                onclick="togglePassword()"
                aria-label="Toggle password"
              >
                <svg
                  id="eye-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="forgot-row">
            <a href="forgot.html" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="submit-btn">
            <span class="btn-shine"></span>
            Sign In →
          </button>
        </form>

        <p class="bottom-link">
          Don't have an account? <a href="register.html">Create one</a>
        </p>
      </div>
    </div>

    <script src="signin.js"></script>
  </body>
</html>
