<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="signin.css" />
</head>
<body>
  <div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
  <div class="grid-bg"></div>
  <div class="wrapper"><div class="card">
    <div class="brand"><div class="brand-icon">R</div><span class="brand-name">Reboot</span></div>
    <h1>Welcome back</h1><p class="subtitle">Sign in to your account to continue</p>
    <form method="post" action="#" id="signin-form">
      <div class="field"><label class="field-label" for="email">Email Address</label><input id="email" name="email" type="email" placeholder="Enter your email address" required /></div>
      <div class="field"><label class="field-label" for="password">Password</label><div class="input-wrap"><input id="password" name="password" type="password" placeholder="Enter your password" required /><button type="button" class="toggle-pw" data-password-toggle="password"></button></div></div>
      <div class="forgot-row"><a href="forgot.html" class="forgot-link">Forgot password?</a></div>
      <button type="submit" class="submit-btn"><span class="btn-shine"></span>Sign In →</button>
    </form>
    <p class="bottom-link">Don't have an account? <a href="register.html">Create one</a></p>
  </div></div>
  <script src="js/form-utils.js"></script>
  <script src="js/password-toggle.js"></script>
  <script src="signin.js"></script>
</body>
</html>
