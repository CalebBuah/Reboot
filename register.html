<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <div class="orbs">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
    </div>
    <div class="grid-bg"></div>

    <div class="wrapper">
      <div class="card">
        <div class="brand">
          <div class="brand-icon">R</div>
          <span class="brand-name">Reboot</span>
        </div>

        <h1>Create your account</h1>
        <p class="subtitle">Fill in the details below to get started</p>

        <form method="post" action="https://register-demo.freecodecamp.org">
          <div class="row">
            <div class="field">
              <label class="field-label" for="first-name">First Name</label>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                </span>
                <input
                  id="first-name"
                  name="first-name"
                  type="text"
                  placeholder="Jane"
                  required
                />
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="last-name">Last Name</label>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                </span>
                <input
                  id="last-name"
                  name="last-name"
                  type="text"
                  placeholder="Smith"
                  required
                />
              </div>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="email">Email Address</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                  />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
              </span>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="jane@example.com"
                required
              />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="new-password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input
                id="new-password"
                name="new-password"
                type="password"
                placeholder="Min. 8 lowercase chars + digits"
                pattern="[a-z0-5]{8,}"
                required
              />
              <button
                type="button"
                class="toggle-pw"
                onclick="togglePassword('new-password', 'eye-icon-reg')"
                aria-label="Toggle password"
              >
                <svg
                  id="eye-icon-reg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="section-divider"><span>Account Type</span></div>

          <div class="account-types">
            <label class="account-card">
              <input
                type="radio"
                name="account-type"
                value="personal"
                checked
              />
              <div class="account-card-body">
                <div class="account-card-icon">👤</div>
                <div>
                  <div class="account-card-label">Personal</div>
                  <div class="account-card-desc">For individuals</div>
                </div>
              </div>
            </label>
            <label class="account-card">
              <input type="radio" name="account-type" value="business" />
              <div class="account-card-body">
                <div class="account-card-icon">🏢</div>
                <div>
                  <div class="account-card-label">Business</div>
                  <div class="account-card-desc">For teams &amp; orgs</div>
                </div>
              </div>
            </label>
          </div>

          <div class="terms-row">
            <input
              type="checkbox"
              id="terms-and-conditions"
              name="terms-and-conditions"
              required
            />
            <p class="terms-text">
              I agree to the
              <a
                href="https://www.freecodecamp.org/news/terms-of-service/"
                target="_blank"
                >Terms of Service</a
              >
              and <a href="#">Privacy Policy</a>
            </p>
          </div>

          <button type="submit" class="submit-btn">
            <span class="btn-shine"></span>
            Create Account →
          </button>
        </form>

        <p class="bottom-link">
          Already have an account? <a href="signin.html">Sign in</a>
        </p>
      </div>
    </div>

    <script src="register.js"></script>
  </body>
</html>
